# The prices and plans of the end-to-end test stack (`make e2e`).
#
# compose.e2e.yaml mounts this folder where config/ is mounted otherwise, so the API
# reads this file in place of config/plans.toml. The fake model counts a word as a
# token, and a credit here is one of its words, read or written.
#
# A guest's limits are far above what a test uses: every test is a new guest, with a
# whole allowance to itself. An account's are a few questions away, for the tests of
# the limits themselves (apps/web/e2e/usage.spec.ts): such a test signs up first.

guests = "guest"
accounts = "free"

session_hours = 5
week_resets = "MON 00:00 UTC"
# Low, so that an allowance of a few hundred words can still be asked something: an
# answer is given the room that is left, down to this.
min_answer_tokens = 64

[prices.standard]
input = 1_000_000
output = 1_000_000

# The fake under its second name (models.toml): what a refusal at a limit offers.
[prices.local]
input = 0
output = 0

# The model that names conversations (models.toml). A title costs the account nothing
# whatever its price, but a model that costs nothing is offered at a limit: so it is
# priced like "standard", and only "local" is offered.
[prices.namer]
input = 1_000_000
output = 1_000_000

# The fake given 3 seconds for an answer (models.toml): priced like "standard", for the
# same reason.
[prices.hurried]
input = 1_000_000
output = 1_000_000

# The model whose server isn't there, which "standard" stands in for (models.toml):
# priced like "standard", for the same reason. A turn of it costs this, whoever answers.
[prices.away]
input = 1_000_000
output = 1_000_000

# Two answers at once, as people get: apps/web/e2e/turns.spec.ts asks for a third.
[plans.guest]
title = "Guest"
session_credits = 100_000
week_credits = 400_000
answers_at_once = 2

# Enough for the few short questions of the tests that sign up for other reasons, and
# gone after two or three long ones.
[plans.free]
title = "Free"
session_credits = 500
week_credits = 5_000
answers_at_once = 3
