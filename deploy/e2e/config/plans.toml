# The prices and plans of the end-to-end test stack (`make e2e`).
#
# compose.e2e.yaml mounts this folder where config/ is mounted otherwise, so the API
# reads this file in place of config/plans.toml. The fake model counts a word as a
# token, and a credit here is one of its words, read or written, but for "namer" below.
#
# A guest's limits are far above what a test uses: every test is a new guest, with a
# whole allowance to itself. An account's are a few questions away, for the tests of
# the limits themselves (apps/web/e2e/usage.spec.ts): such a test signs up first.

guests = "guest"
accounts = "free"

session_hours = 5
week_resets = "MON 00:00 UTC"
# Low, so that an allowance of a few hundred words can still be asked something: an
# answer is given the room that is left, down to this.
min_answer_tokens = 64

[prices.standard]
input = 1_000_000
output = 1_000_000

# The fake under its second name (models.toml): what a refusal at a limit offers.
[prices.local]
input = 0
output = 0

# The model that names conversations (models.toml). A title costs the account nothing
# whatever its price, but a model that costs nothing is offered at a limit: so it isn't
# free, and only "local" is offered. It has the shipped price (config/plans.toml), a
# quarter of a credit a word read and a tenth of that from the cache: the one model of
# the stack whose row in the page's menu of models says two numbers, and whose price
# has a cached_input of its own (apps/web/e2e/picker.spec.ts).
[prices.namer]
input = 250_000
output = 1_000_000
cached_input = 25_000

# The fake given 3 seconds for an answer (models.toml): priced like "standard", so that
# it isn't free either.
[prices.hurried]
input = 1_000_000
output = 1_000_000

# The model whose server isn't there, which "standard" stands in for (models.toml):
# priced like "standard", for the same reason. A turn of it costs this, whoever answers.
[prices.away]
input = 1_000_000
output = 1_000_000

# The fake with a budget of one request a minute (models.toml): priced like "standard",
# for the same reason.
[prices.rationed]
input = 1_000_000
output = 1_000_000

# The fake behind a gate of one (models.toml): priced like "standard", for the same
# reason.
[prices.queued]
input = 1_000_000
output = 1_000_000

# Two answers at once, as people get: apps/web/e2e/turns.spec.ts asks for a third.
[plans.guest]
title = "Guest"
session_credits = 100_000
week_credits = 400_000
answers_at_once = 2

# Enough for the few short questions of the tests that sign up for other reasons, and
# gone after two or three long ones. Two API keys, where the shipped file gives
# accounts none: apps/web/e2e/keys.spec.ts makes them in the account's place, and
# reaches the plan's number with the second.
[plans.free]
title = "Free"
session_credits = 500
week_credits = 5_000
answers_at_once = 3
api_keys = 2
