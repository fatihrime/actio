# The models the end-to-end test stack offers (`make e2e`): the fake, under three names.
#
# compose.e2e.yaml mounts this folder where config/ is mounted otherwise, so the API and
# the worker read this file in place of config/models.toml. "standard" is the same name
# as there: the web app asks for the default model and never learns that this one only
# echoes.
# See packages/fakellm/README.md for what it answers, and how a test scripts it.

default = "standard"

# The fake's quiet model names conversations: it says nothing unless the question tells
# it what to say, `[[say: Flat tyres]]`. So a conversation keeps its first question's
# first line, by which the end-to-end tests find it in the list, unless a test asks for
# a title. An echo would name every conversation alike: the request for a title quotes
# the question after the same instructions each time.
titles = "namer"

[providers.fake]
kind = "openai-compatible"
# The fakellm container, by its name on the stack's `models` network.
url = "http://fakellm:8100/v1"

[models.standard]
title = "Fake model"
provider = "fake"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
# So the tests can ask for reasoning, which the fake writes on request: [[think: ...]].
thinking = true

# The same fake once more, as a model that costs nothing (plans.toml): what the page
# offers to carry on with when a usage limit is reached.
[models.local]
title = "Local"
provider = "fake"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
thinking = false

# The model that names conversations, above. It is on offer like the others, and priced
# like "standard" (plans.toml): one that cost nothing would be offered at a limit.
[models.namer]
title = "Namer"
provider = "fake"
model = "fake-quiet"
context_window = 8192
max_output_tokens = 2048
thinking = false
