# The models the end-to-end test stack offers (`make e2e`): the fake, under six names,
# one of them with a budget of one request a minute and one behind a gate that lets one
# answer through at a time, and a seventh model whose server isn't there, which the
# fake stands in for.
#
# compose.e2e.yaml mounts this folder where config/ is mounted otherwise, so the API and
# the worker read this file in place of config/models.toml. "standard" is the same name
# as there: the web app asks for the default model and never learns that this one only
# echoes.
# See packages/fakellm/README.md for what it answers, and how a test scripts it.

default = "standard"

# The fake's quiet model names conversations: it says nothing unless the question tells
# it what to say, `[[say: Flat tyres]]`. So a conversation keeps its first question's
# first line, by which the end-to-end tests find it in the list, unless a test asks for
# a title. An echo would name every conversation alike: the request for a title quotes
# the question after the same instructions each time.
titles = "namer"

[providers.fake]
kind = "openai-compatible"
# The fakellm container, by its name on the stack's `models` network.
url = "http://fakellm:8100/v1"

# The same fakellm container once more, given 3 seconds for a whole answer, where the
# others keep the client's five minutes: an answer the fake writes slowly, `[[pace:
# 0.5]]`, is cut there, and the page says so (apps/web/e2e/time-limit.spec.ts). Nothing
# else is asked here.
[providers.fake-hurried]
kind = "openai-compatible"
url = "http://fakellm:8100/v1"
answers_within_seconds = 3

# The fakellm container at a port where nothing listens: a connection there is refused at
# once, so the model on it is never ready, and the one that stands in for it answers
# (apps/web/e2e/stand-in.spec.ts). Nothing else is asked here.
[providers.nowhere]
kind = "openai-compatible"
url = "http://fakellm:8101/v1"

# The same fakellm container once more, for the model with a budget below. A provider of
# its own: on "fake", that model would share one budget with "standard" and "local",
# which are the same model there, and the three would have to state the same figures.
# Nothing else is asked here.
[providers.fake-rationed]
kind = "openai-compatible"
url = "http://fakellm:8100/v1"

# The same fakellm container once more, behind a gate that lets one answer through at a
# time, for the model "queued" below: an answer asked while another is written there
# waits its turn, and the page says behind how many (apps/web/e2e/waits.spec.ts). A
# provider of its own: on "fake", every test's answers would wait for each other's.
# Nothing else is asked here.
[providers.fake-queued]
kind = "openai-compatible"
url = "http://fakellm:8100/v1"
answers_at_once = 1

[models.standard]
title = "Fake model"
provider = "fake"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
# So the tests can ask for reasoning, which the fake writes on request: [[think: ...]].
thinking = true

# The same fake once more, as a model that costs nothing (plans.toml): what the page
# offers to carry on with when a usage limit is reached.
[models.local]
title = "Local"
provider = "fake"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
thinking = false

# The model that names conversations, above. It is on offer like the others, and isn't
# free (plans.toml): one that cost nothing would be offered at a limit.
[models.namer]
title = "Namer"
provider = "fake"
model = "fake-quiet"
context_window = 8192
max_output_tokens = 2048
thinking = false

# The fake on the hurried provider above. Its test, written before the page could
# choose a model, gives its question this model's name on its way out, as for "namer"
# (a test of the picker chooses in the page: apps/web/e2e/picker.spec.ts). Priced like
# "standard" (plans.toml), so that it isn't offered at a limit either. Its title is as
# long as the longest of config/examples/free-cloud, 21 characters: the picker's test
# chooses it in a narrow window, where a title that long gives way, and ends in "…".
[models.hurried]
title = "Hurried, in 3 seconds"
provider = "fake-hurried"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
thinking = true

# The model on the provider above, whose server isn't there: "standard" stands in for
# it, and the page says under the answer that it did. Its test gives its question this
# model's name on its way out, as for "hurried", and the picker's test chooses it in
# the page. Priced like "standard" (plans.toml), so that it isn't offered at a limit
# either. Its window is half of "standard"'s: a page that said the answer's tokens of
# the asked model's window would say another number than the one the test waits for.
[models.away]
title = "Away"
provider = "nowhere"
model = "fake-chat"
context_window = 4096
max_output_tokens = 2048
thinking = false
then = ["standard"]

# The fake on the provider above, with a budget of one request a minute, of which Actio
# keeps the one: a question asked within a minute of the last one sent to it is refused
# for now, and the page counts the wait down (apps/web/e2e/no-budget.spec.ts). That
# test gives each of its questions this model's name on its way out, as for "away".
# The count is kept in the stack's Valkey, for a minute, so a test meets it as the last
# one left it. Priced like "standard" (plans.toml), so that it isn't offered at a limit
# either.
[models.rationed]
title = "Rationed"
provider = "fake-rationed"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
thinking = false
requests_a_minute = 1

# The fake on the provider above, behind its gate of one: a second answer asked while one
# is written waits its turn, and the page says behind how many other answers. Its test
# gives each of its questions this model's name on its way out, as for "rationed".
# Priced like "standard" (plans.toml), so that it isn't offered at a limit either.
[models.queued]
title = "Queued"
provider = "fake-queued"
model = "fake-chat"
context_window = 8192
max_output_tokens = 2048
thinking = false
