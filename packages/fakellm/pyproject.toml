[project]
name = "actio-fakellm"
version = "0.0.0"
description = "A deterministic, OpenAI-compatible fake LLM server for Actio's tests."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fakellm = "actio_fakellm.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
