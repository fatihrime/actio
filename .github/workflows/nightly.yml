name: Nightly

# Long random runs that are too slow for every push: the usage-limits engine's property,
# state-machine and differential tests, with 5,000 examples each instead of 200.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC, off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  quota:
    name: Usage-limits engine, 5,000 examples
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync
      - run: uv run pytest packages/quota
        env:
          HYPOTHESIS_PROFILE: nightly
          ACTIO_REQUIRE_DOCKER: "1"
