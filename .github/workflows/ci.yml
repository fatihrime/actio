name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail if uv.lock doesn't match pyproject.toml

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-python: true
      # Installs pnpm and the Node.js pinned in package.json, then runs `pnpm install`.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true # fail if pnpm-lock.yaml is missing or out of date
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync
      - run: make check
        env:
          SKIP: gitleaks # the secrets job below scans the full history instead
          HYPOTHESIS_PROFILE: ci # more random examples than on a laptop

  quickstart:
    name: Quickstart on Linux (make up)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing installed beyond the runner's Docker, make and openssl: the README's
      # quickstart, as a visitor would run it.
      - name: Build and start the whole stack in containers
        run: make up
      - name: Smoke-test it through Caddy
        run: make smoke
      - name: Show the containers' logs
        if: failure()
        run: docker compose logs --no-color

  e2e:
    name: End-to-end tests in a browser (make e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm and the Node.js pinned in package.json, then runs `pnpm install`:
      # the tests are run by Playwright, one of the web app's development tools.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Install the browser the tests drive, and the system libraries it needs
        run: pnpm --dir apps/web exec playwright install --with-deps --only-shell chromium
      # Builds the images, starts the stack with a fake model in Ollama's place, runs
      # the tests against it in the browser, and takes it down again.
      - name: Run the end-to-end tests
        run: make e2e
      # For each failed test: what the page looked like at every step.
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose /repo
