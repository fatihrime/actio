# The whole stack in containers, shaped like production: `make up` serves it at
# http://localhost:8080. `make dev` adds compose.dev.yaml and runs only Postgres,
# Valkey and Caddy here, with the API and the web app native.
# See docs/adr/0004-local-development-stack.md and 0005-container-images.md.
#
# Rules, checked by deploy/tests/test_compose_policy.py:
#   - only Caddy publishes a port, on 127.0.0.1;
#   - every image is pinned by digest, or built from Dockerfiles whose base images are;
#   - the data services sit only on the internal network;
#   - every container runs as a non-root user, read-only, without Linux capabilities,
#     with a memory limit and a health check. A job that runs once and exits, such as
#     `migrate`, has no health check: what depends on it waits for it to succeed;
#   - only the worker is started again by Docker, and only when it failed.
name: actio

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The API, the migration job and the worker run the same image.
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

# Where the API, the migration job and the worker find their data, with the passwords
# from .env. They are generated as hex, so they need no escaping inside a URL.
x-api-stores: &api-stores
  ACTIO_DATABASE_URL: postgresql://actio:${POSTGRES_PASSWORD:?run make bootstrap to create .env}@postgres:5432/actio
  ACTIO_VALKEY_URL: valkey://:${VALKEY_PASSWORD:?run make bootstrap to create .env}@valkey:6379/0

# How the API and the worker find the models on offer: the file that lists them, and the
# way to Ollama. The worker asks a model for a conversation's title. Shared, so that the
# two can't find different models, or look for Ollama in different places.
x-models: &models
  extra_hosts:
    # Docker Desktop knows that name by itself. On Linux, this line teaches it.
    - "host.docker.internal:host-gateway"
  volumes:
    # The models on offer. Edit config/models.toml and restart the API and the worker:
    # no rebuild.
    - ./config:/app/config:ro
x-ollama: &ollama
  # Ollama runs on this machine itself, not in a container: there it can use the
  # graphics processor, which a container on macOS can't. From inside a container the
  # machine is called host.docker.internal.
  ACTIO_OLLAMA_URL: ${ACTIO_OLLAMA_URL:-http://host.docker.internal:11434}
# The keys of the cloud providers whose models a models file may offer, such as
# config/examples/free-cloud: Groq's and the Gemini API's. A models file names the
# variable a provider's key is in (`api_key_env`); a key under another name is added
# here. Without a value, each is passed on from .env when it is set there, and otherwise
# left out. Shared by the API and the worker, so that the two can't hold different keys.
x-cloud-keys: &cloud-keys
  GROQ_API_KEY:
  GEMINI_API_KEY:

services:
  caddy:
    # The pinned Caddy image with the config built in (deploy/caddy/Dockerfile). A
    # change to the Caddyfile reaches the proxy when the image is built again, and
    # Compose starts the proxy from the new one: `make up`, `make dev` and `make e2e`
    # build it. A plain `docker compose up` reuses the image that is there. The config
    # holds the limit on a request's size that protects the API.
    build:
      context: deploy/caddy
      dockerfile: Dockerfile
    <<: *hardening
    user: "1000:1000"
    tmpfs: [/config, /data] # Caddy's runtime state; nothing worth keeping
    environment:
      ACTIO_API_UPSTREAM: api:8000
      ACTIO_WEB_UPSTREAM: web:3000
    ports:
      - "127.0.0.1:${ACTIO_HTTP_PORT:-8080}:8080"
    networks: [edge]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2020"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *hardening
    user: node
    init: true # forwards stop signals to Node.js and reaps child processes
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [edge]
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  # Brings the database schema up to date, then exits. The API and the worker start only
  # after it succeeded, so neither works on a schema it doesn't expect.
  migrate:
    build: *api-build
    <<: *hardening
    user: actio
    tmpfs: [/tmp]
    command: [actio, --role, migrate]
    restart: "no"
    environment: *api-stores
    networks: [backend]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    <<: [*hardening, *models]
    user: actio
    tmpfs: [/tmp]
    environment:
      <<: [*api-stores, *ollama, *cloud-keys]
      # Only Caddy and the web app can reach the API here, so trust the client address
      # and scheme that Caddy forwards.
      ACTIO_FORWARDED_ALLOW_IPS: "*"
      # The address people open in their browser. Set ACTIO_PUBLIC_URL in .env when
      # Actio is served under another name, such as https://chat.example.com.
      ACTIO_PUBLIC_URL: ${ACTIO_PUBLIC_URL:-http://localhost:${ACTIO_HTTP_PORT:-8080}}
      # Rate limits, such as 30/hour. Without a value, a variable is passed on from .env
      # when it is set there, and otherwise left out: then the API's own default applies.
      ACTIO_LIMIT_GUESTS_PER_ADDRESS:
      ACTIO_LIMIT_SIGNUPS_PER_ADDRESS:
      ACTIO_LIMIT_LOGINS_PER_ADDRESS:
      ACTIO_LIMIT_LOGINS_PER_EMAIL:
      ACTIO_LIMIT_TURNS_PER_USER:
      ACTIO_LIMIT_WARM_UPS_PER_USER:
    networks: [edge, backend, models]
    mem_limit: 512m
    # Told to stop, the API first lets the answers that are being written come to an
    # end: they get 15 seconds, and what is unfinished then is halted and recorded as
    # interrupted, while its readers are still connected. The web server itself waits
    # up to 25 seconds for the requests it is answering. Docker's own patience is 10
    # seconds, and would kill the API in the middle of that. See
    # docs/adr/0022-turns-that-run-apart-from-their-request.md.
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the background jobs, such as the sweep of expired guests, one at a time. See
  # docs/adr/0024-background-jobs-in-a-queue-in-postgres.md.
  worker:
    build: *api-build
    # The models on offer, where the API finds them: one job asks a model for a
    # conversation's title. A mistake in the models file stops it, as it stops the API.
    <<: [*hardening, *models]
    user: actio
    # Python listens for the stop signal only once it has started. As process 1 a
    # program gets no signal it has no handler for, so a stop in that first half
    # second would wait out Docker's patience. An init process in front ends it at once.
    init: true
    tmpfs: [/tmp]
    command: [actio, --role, worker]
    environment:
      # Where its data is, Valkey for one job, counting again what the usage counters
      # missed, and the models' servers for another, a conversation's title.
      <<: [*api-stores, *ollama, *cloud-keys]
      # The file it touches every 5 seconds while it works, for its health check below.
      # On the tmpfs: the root filesystem is read-only.
      ACTIO_ALIVE_FILE: /tmp/actio-worker-alive
    # Nothing reaches it: no port, and not on `edge`. It reaches the data services on
    # `backend`, and the models' servers through `models`, its one way out.
    networks: [backend, models]
    mem_limit: 256m
    # It ends when it can't go on: 30 seconds after it lost its database, or with an
    # error it has no answer to. Docker starts it again then, and only then: not when
    # it ended well because it was told to stop. That is also why it stays down, like
    # the rest of the stack, after Docker itself was restarted: Docker stops it first,
    # and it ends well. Only one that Docker couldn't stop, as when the machine lost
    # power, comes back by itself, alone, and tries every half minute until `make up`.
    restart: on-failure
    # Told to stop, it lets the job in hand finish for up to 15 seconds, then takes
    # itself off the queue's list of workers and closes its connections. Docker's own
    # patience is 10 seconds. One told to stop just after it lost its database, before
    # it has noticed, would wait 30 seconds more for a connection: Docker cuts that
    # short, and nothing is lost, since such a worker has no job that could be finished.
    stop_grace_period: 25s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # It has no port to probe: healthy while it has touched the file above lately.
      test: ["CMD", "python", "-m", "actio.core.alive"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    <<: *hardening
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: actio
      POSTGRES_DB: actio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap to create .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "--username=actio", "--dbname=actio"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    <<: *hardening
    user: valkey
    # Nothing is kept on disk: no snapshots (--save ""), no append-only file. What
    # Valkey holds, the rate limits' buckets and the usage limits' counters, is
    # rebuilt or refilled when it is missing; the usage counters from the ledger in
    # Postgres. A Valkey that came back with an old file would hold counters that look
    # valid and are not. See docs/adr/0020-usage-limits-on-turns.md.
    command:
      - valkey-server
      - --requirepass
      - "${VALKEY_PASSWORD:?run make bootstrap to create .env}"
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?run make bootstrap to create .env} # for the health check
    tmpfs: [/data] # the image's working directory, declared a volume there; never written
    networks: [backend]
    mem_limit: 256m
    healthcheck:
      # valkey-cli exits 0 even when it can't log in, so check for the actual reply.
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge: {} # Caddy, the web app and the API
  backend:
    internal: true # no route out: only the API, migrate and the worker reach the data
  models: {} # the way out to the models' servers, such as Ollama: the API and the worker

volumes:
  postgres-data:
