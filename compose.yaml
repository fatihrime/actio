# The whole stack in containers, shaped like production: `make up` serves it at
# http://localhost:8080. `make dev` adds compose.dev.yaml and runs only Postgres,
# Valkey and Caddy here, with the API and the web app native.
# See docs/adr/0004-local-development-stack.md and 0005-container-images.md.
#
# Rules, checked by deploy/tests/test_compose_policy.py:
#   - only Caddy publishes a port, on 127.0.0.1;
#   - every image is pinned by digest, or built from Dockerfiles whose base images are;
#   - the data services sit only on the internal network;
#   - every container runs as a non-root user, read-only, without Linux capabilities,
#     with a memory limit and a health check. A job that runs once and exits, such as
#     `migrate`, has no health check: what depends on it waits for it to succeed.
name: actio

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The API and the migration job run the same image.
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

# Where the API finds its data, with the passwords from .env. They are generated as hex,
# so they need no escaping inside a URL.
x-api-stores: &api-stores
  ACTIO_DATABASE_URL: postgresql://actio:${POSTGRES_PASSWORD:?run make bootstrap to create .env}@postgres:5432/actio
  ACTIO_VALKEY_URL: valkey://:${VALKEY_PASSWORD:?run make bootstrap to create .env}@valkey:6379/0

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    <<: *hardening
    user: "1000:1000"
    tmpfs: [/config, /data] # Caddy's runtime state; nothing worth keeping
    environment:
      ACTIO_API_UPSTREAM: api:8000
      ACTIO_WEB_UPSTREAM: web:3000
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${ACTIO_HTTP_PORT:-8080}:8080"
    networks: [edge]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2020"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *hardening
    user: node
    init: true # forwards stop signals to Node.js and reaps child processes
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [edge]
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  # Brings the database schema up to date, then exits. The API starts only after it
  # succeeded, so the API never serves from a schema it doesn't expect.
  migrate:
    build: *api-build
    <<: *hardening
    user: actio
    tmpfs: [/tmp]
    command: [actio, --role, migrate]
    restart: "no"
    environment: *api-stores
    networks: [backend]
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    <<: *hardening
    user: actio
    tmpfs: [/tmp]
    environment:
      <<: *api-stores
      # Only Caddy and the web app can reach the API here, so trust the client address
      # and scheme that Caddy forwards.
      ACTIO_FORWARDED_ALLOW_IPS: "*"
      # The address people open in their browser. Set ACTIO_PUBLIC_URL in .env when
      # Actio is served under another name, such as https://chat.example.com.
      ACTIO_PUBLIC_URL: ${ACTIO_PUBLIC_URL:-http://localhost:${ACTIO_HTTP_PORT:-8080}}
      # Rate limits, such as 30/hour. Without a value, a variable is passed on from .env
      # when it is set there, and otherwise left out: then the API's own default applies.
      ACTIO_LIMIT_GUESTS_PER_ADDRESS:
      ACTIO_LIMIT_SIGNUPS_PER_ADDRESS:
      ACTIO_LIMIT_LOGINS_PER_ADDRESS:
      ACTIO_LIMIT_LOGINS_PER_EMAIL:
    networks: [edge, backend]
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    <<: *hardening
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      POSTGRES_USER: actio
      POSTGRES_DB: actio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make bootstrap to create .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "--username=actio", "--dbname=actio"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    <<: *hardening
    user: valkey
    command: [valkey-server, --requirepass, "${VALKEY_PASSWORD:?run make bootstrap to create .env}"]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?run make bootstrap to create .env} # for the health check
    volumes:
      - valkey-data:/data
    networks: [backend]
    mem_limit: 256m
    healthcheck:
      # valkey-cli exits 0 even when it can't log in, so check for the actual reply.
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge: {} # Caddy, the web app and the API
  backend:
    internal: true # no route out: only the API reaches the data services

volumes:
  postgres-data:
  valkey-data:
