[project]
name = "actio"
version = "0.0.0"
description = "Actio's API and worker processes: one modular FastAPI application."
requires-python = ">=3.13"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
actio = "actio.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
