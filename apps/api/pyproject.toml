[project]
name = "actio"
version = "0.0.0"
description = "Actio's API and worker processes: one modular FastAPI application."
requires-python = ">=3.13"
license = "MIT"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "valkey>=6.2.0",
]

[project.scripts]
actio = "actio.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
