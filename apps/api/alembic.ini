# For Alembic's own command line, which `make migration` uses to write a new migration.
# The application doesn't read this file: it finds the migrations inside its package
# (see actio/core/schema.py), and takes the database URL from ACTIO_DATABASE_URL.
[alembic]
script_location = %(here)s/src/actio/migrations
# Numbered files, in the order they apply: 0002_add_users.py
file_template = %%(rev)s_%%(slug)s
