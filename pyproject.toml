# Python workspace root. The root is not a package: `apps/*` and `packages/*` hold the
# members. This file holds the shared dev tools and their configuration.

[tool.uv]
required-version = ">=0.13"
# Always use uv's own CPython build, so conda, pyenv or Homebrew Pythons can't leak in.
# Override with UV_PYTHON_PREFERENCE=system if you need to.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["apps/api", "packages/fakellm", "packages/llm", "packages/quota"]

[tool.uv.sources]
actio = { workspace = true }
actio-fakellm = { workspace = true }
actio-llm = { workspace = true }
actio-quota = { workspace = true }

[dependency-groups]
# `uv sync` installs this group by default, so one command sets up every member and tool.
dev = [
    "actio",
    "actio-fakellm",
    "actio-llm",
    "actio-quota",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "openai>=3.46.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    { include-group = "docs" },
]
# The documentation site's generator. Part of `dev`; the docs workflow installs it alone.
docs = [
    "zensical>=0.1.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = [
    "apps/api/tests",
    "packages/fakellm/tests",
    "packages/llm/tests",
    "packages/quota/tests",
    "deploy/tests",
]
# importlib mode lets test files in different packages share names.
addopts = ["--import-mode=importlib", "-ra"]
strict = true
filterwarnings = ["error"]

# `make test` measures coverage of the quota engine only, and fails below 90%: its
# correctness is the project's headline claim.
[tool.coverage.run]
branch = true
source_pkgs = ["actio_quota"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "packages/fakellm/src", "packages/llm/src", "packages/quota/src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern syntax for the target version
    "B",       # likely bugs
    "A",       # shadowed builtins
    "C4",      # comprehensions
    "DTZ",     # naive datetimes: usage windows depend on correct time zones
    "T20",     # stray print()
    "PT",      # pytest style
    "RET",     # return statements
    "SIM",     # simplifications
    "TID",     # import rules (no relative imports)
    "ARG",     # unused arguments
    "PTH",     # pathlib over os.path
    "ASYNC",   # blocking calls in async code
    "S",       # security (bandit)
    "BLE",     # blind `except Exception`
    "FAST",    # FastAPI conventions
    "PERF",    # performance pitfalls
    "RUF",     # Ruff's own rules
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311"]  # pytest is built on assert; seeded random is fine in tests

[tool.ruff.lint.flake8-builtins]
# `credits` is only a builtin in the interactive shell, and it's the quota engine's unit.
ignorelist = ["credits"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "apps/api/tests",
    "packages/fakellm/src",
    "packages/fakellm/tests",
    "packages/llm/src",
    "packages/llm/tests",
    "packages/quota/src",
    "packages/quota/tests",
    "deploy/tests",
]
# Name modules by their path, so each test folder's conftest.py is a distinct module.
# The src folders are roots, so `actio` and `actio_fakellm` keep their import names.
explicit_package_bases = true
mypy_path = ["apps/api/src", "packages/fakellm/src", "packages/llm/src", "packages/quota/src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
