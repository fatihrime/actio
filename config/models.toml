# The models this installation offers, and where each one runs.
#
# People and conversations refer to a model by the name it has here, such as
# "standard". What is behind that name can then change, to a larger model or to another
# server, without anything that asked for "standard" having to know.
#
# The API and the worker read this file when they start: restart them after a change.
# A mistake here stops them from starting, with a message that says what is wrong.
# See docs/adr/0013-the-models-on-offer-are-a-file.md.

# The model used when a request names none.
default = "standard"

# The model that names a conversation after its first answer, in a few words. It is
# asked once per conversation, by the worker, and a title someone gave the conversation
# is never written over. Left out, no model does, and a conversation keeps its first
# question's first line. See docs/adr/0025-titles-written-by-a-model.md.
titles = "standard"

# --- Where models run -------------------------------------------------------------------
#
# kind = "ollama": an Ollama server. Its address is ACTIO_OLLAMA_URL, which defaults to
#   this machine. What a model can do, such as reasoning before it answers, is asked
#   from the server, not written here.
#
# kind = "openai-compatible": any server that speaks OpenAI's Chat Completions API, such
#   as LM Studio, llama.cpp's server or vLLM. It needs a `url` that ends where the API
#   starts, and may name the environment variable that holds its key:
#
#   [providers.lmstudio]
#   kind = "openai-compatible"
#   url = "http://127.0.0.1:1234/v1"
#   api_key_env = "LMSTUDIO_API_KEY"
#
#   Groq's and the Gemini API's free tiers are such servers: config/examples/free-cloud
#   is a pair of files to copy that offers their models beside the one below.
#
# answers_at_once: how many answers the server writes at the same time, across all the
#   models it runs. An answer that would be one more waits its turn inside Actio, which
#   asks the server only once it has room, so that the wait doesn't count against the
#   server's time to answer. Left out, it is 1 for "ollama", and there is no limit for
#   "openai-compatible", which may write many at once. Set it to what the server was
#   started to handle in parallel: OLLAMA_NUM_PARALLEL for Ollama, the number of parallel
#   requests for LM Studio or llama.cpp's server:
#
#   answers_at_once = 4
#
# begins_within_seconds: how long the server is given, from the moment a question is
#   sent, to begin its answer. One that hasn't begun by then counts as away, and the
#   models that stand in for its model are asked (`then`, below). A load of a model
#   ahead of the first question waits as long. A number greater than 0. Left out, it is
#   90 seconds, which covers a model that the server has to load first:
#
#   begins_within_seconds = 30
#
# answers_within_seconds: how long the server is given, from the same moment, for a
#   whole answer. An answer the model is still writing then stops there: it is kept and
#   paid for, as one that reached a limit, and the page says so. A model that has
#   written nothing by then counts as failing, and the models that stand in for it are
#   asked. The first line of an answer has to come within it too, and so has a load of
#   a model ahead of the first question. A number greater than 0. Left out, it is 300
#   seconds, in which a full answer of 2,048 tokens needs more than 6.8 tokens a second,
#   since loading the model and reading the conversation count too: on a machine that
#   writes more slowly, raise it:
#
#   answers_within_seconds = 600

[providers.ollama]
kind = "ollama"

# --- The models -------------------------------------------------------------------------
#
# title              what people see
# provider           one of the providers above
# model              the model's name on that server
# context_window     how many tokens the model holds: the conversation and its answer
# max_output_tokens  the most tokens one answer may have, reasoning included
# thinking           for an "openai-compatible" server only: whether the model can reason
#                    before it answers (true or false). Ollama says so itself.
# thinking_off       for such a model whose `thinking` is true: what a request holds when
#                    a turn asks for no reasoning, as a table. Left out, it is
#                    { reasoning_effort = "none" }, which some models refuse; {} is
#                    nothing at all
# thinking_on        the same, when a turn asks for reasoning. Left out, nothing: the
#                    model's own default. Neither may hold what Actio writes into a
#                    request itself, such as `model` or `max_tokens`:
#
#   thinking_off = { reasoning_effort = "low" }
#   thinking_on = { reasoning_effort = "medium" }
#
# then               other models of this file, asked in this one's place, in this
#                    order, when it can't answer: its server is away, too busy, or
#                    refuses the request. Only before the first word, or thought, of
#                    an answer: after it, the answer is this model's, and so is its
#                    failure. A model that isn't ready is passed over. Each is asked as
#                    the model it is, on its server, with its window and its limits,
#                    and their own `then` isn't followed. The question costs what it
#                    costs with this model, and no answer is longer than this model's
#                    may be. Left out, none. See
#                    docs/adr/0028-a-model-names-those-that-stand-in-for-it.md:
#
#   then = ["standard"]
#
# tokens_a_minute    how many tokens the model's server takes from this installation's
#                    account in a minute, as a cloud provider's plan says for each of
#                    its models: a request larger than that fits in no minute there,
#                    and Groq's free plan was seen to refuse one whole. The model's
#                    room is the smaller of this and its context_window. A
#                    request larger than its room, by Actio's guess at its tokens, isn't
#                    sent to it while another model of the same chain (`then`) is ready
#                    and has room for it. When none has, each is asked all the same. A
#                    whole number of 1 or more. Left out, the server has no such limit,
#                    as a local server has none, and the room is the window.
#                    See docs/adr/0029-a-model-is-passed-over-for-a-request-too-large.md:
#
#   tokens_a_minute = 8000
#
# requests_a_minute  the same, of the requests the server takes in a minute
# requests_a_day     ... in a day
# tokens_a_day       ... and of the tokens it takes in a day, a request's and its answer's.
#                    With tokens_a_minute, these are the model's budget: Actio counts
#                    what it sends to the model, its requests and their tokens, in Valkey,
#                    and keeps to nine tenths of each figure. A ready model that has
#                    nothing left of one for a request is asked after the models of the
#                    same chain that have some; when none of those with room for it has
#                    any, the question is refused for now, with how long to wait. Each
#                    is the provider's own figure, a whole number of 1 or more, and may
#                    be there without the others. Two models of this file that are the
#                    same model on the same provider share one budget, and state the same
#                    figures. Left out, the server has no such limit.
#                    See docs/adr/0030-the-providers-budgets-are-counted.md:
#
#   requests_a_minute = 30
#   requests_a_day = 1000
#   tokens_a_day = 200000
#
# Several models on one Ollama: it keeps in memory what it decides it has room for, and
# was seen to unload one model to load another on a machine with room for both. The page
# asks for the model that answers to be loaded ahead, so with two models in use their
# loads push each other out, and a question that follows the other model's load waits
# for its own model again. To avoid it, offer one model on an Ollama; or lower how
# often an account may ask for a load, ACTIO_LIMIT_WARM_UPS_PER_USER. See
# docs/adr/0026-models-loaded-ahead-of-the-first-question.md.

[models.standard]
title = "Qwen 3.5 4B"
provider = "ollama"
# Get it with: ollama pull qwen3.5:4b-q4_K_M  (3.3 GB)
model = "qwen3.5:4b-q4_K_M"
# Ollama sizes the model's memory by this: 3.3 GB here, 4.2 GB at 32768.
context_window = 8192
max_output_tokens = 2048
