# What using a model costs, and how much each kind of account may use.
#
# Usage is counted in credits. A request must fit in two windows at once: a session,
# which opens with the first message and lasts some hours, and the week. Near a limit
# an answer gets less room; with too little left to answer at all, the request is
# refused, and told when the window starts over.
#
# The API reads this file when it starts: restart it after a change. A mistake here
# stops it from starting, with a message that says what is wrong.
# See docs/adr/0020-usage-limits-on-turns.md.

# Which of the plans below a visitor who hasn't signed up gets, and which an account,
# unless the account was put on another of its own (see the plans).
guests = "guest"
accounts = "free"

# --- The two windows --------------------------------------------------------------------

# A session opens with the first message, and lasts this long.
session_hours = 5

# The week starts over at this moment, by the clock of the place named: a day (MON to
# SUN), a time, and a time zone such as Europe/Istanbul or UTC.
week_resets = "MON 00:00 Europe/Istanbul"

# The shortest answer worth starting, in tokens. A request that can't afford this much
# is refused, instead of being answered in a handful of words.
min_answer_tokens = 256

# --- What a model costs -----------------------------------------------------------------
#
# In credits per million tokens, for every model in models.toml, under the same name:
#
# input         what the model reads: the conversation so far
# output        what it writes: its answer, and its reasoning
# cached_input  what it reads again from its server's cache. Left out: the price of input
#
# Here a credit is one token of an answer, and reading costs a quarter of writing. A
# question with a page of conversation behind it and a page of answer costs about 600.
#
# The list of models (GET /api/models) says each model's price, and the page's menu of
# models says it under each title, in credits a token, unless every model's reads the
# same there.
#
# A model with input = 0 and output = 0 is free: it uses up no credits, so it is never
# refused. Whether a machine of your own is shared out fairly, or just used, is yours
# to say here.

[prices.standard]
input = 250_000
output = 1_000_000
cached_input = 25_000

# --- The plans --------------------------------------------------------------------------
#
# title            what people see
# session_credits  how much one session allows
# week_credits     how much one week allows
# answers_at_once  how many answers one account may have being written at the same
#                  time, in all its conversations. One more is refused, with the advice
#                  to wait for one to finish or to stop one. A turn that waits for the
#                  model's server to have room (models.toml) counts too.
# api_keys         how many API keys an account on the plan may have at once, from 0 to
#                  100. A key works while its account's plan allows some: an account
#                  taken off such a plan has its keys refused, until it is put back on
#                  one. A guest never has a key, whatever its plan says.
#
# Leave session_credits, week_credits or answers_at_once out and that has no limit: a
# plan with none of the three limits nothing. api_keys is the other way round: left out,
# or 0, an account on the plan may have no API key at all.

[plans.guest]
title = "Guest"
session_credits = 25_000
week_credits = 100_000
answers_at_once = 2

[plans.free]
title = "Free"
session_credits = 100_000
week_credits = 600_000
answers_at_once = 3

# A plan that neither guests nor accounts names, above, is given to no account by
# itself. An account is put on one, taken off it again, and asked which it is on with
#
#   make plan email=you@example.com plan=dev
#   make plan email=you@example.com args=--default
#   make plan email=you@example.com
#
# which holds from the account's next question, and keeps what it has used in a
# session or a week that is still open. This one is for an account that uses much more
# than a chat does, and the one plan here that lets an account make API keys.
[plans.dev]
title = "Developer"
session_credits = 1_500_000
week_credits = 8_000_000
answers_at_once = 4
api_keys = 10
