# An example to copy: the models of two cloud providers' free tiers, Groq's and the
# Gemini API's, offered beside the model Actio ships with, which stays the default.
#
# Each provider's key goes in .env, GROQ_API_KEY and GEMINI_API_KEY: a key that isn't
# set stops the API from starting. `make preflight` says what each key's account may use.
# Then, with this file and plans.toml beside it:
#
# - under `make dev`, copy the two to a folder of your own, config/local/, which git
#   leaves alone, and point ACTIO_MODELS_FILE=config/local/models.toml and
#   ACTIO_PLANS_FILE=config/local/plans.toml at the copies in .env. Nothing tracked
#   changes;
# - under `make up`, the containers read config/models.toml and config/plans.toml, so
#   copy the two over those. That changes two tracked files, and the repository's own
#   tests read config/ as it is shipped: run them with the shipped pair back.
#
# Run `make dev` or `make up` again after either. The page offers them all, in the list
# that the first button under its box opens, and asks the default model until a reader
# chooses another: `default` below decides which one a new browser starts with.
# `GET /api/models` lists them all, and a turn's request may name one.
#
# On the Gemini API's free tier, what is sent may be used to improve Google's products
# and be read by human reviewers: nothing private goes through a free key.
#
# What each setting means is in config/models.toml. What the two providers were seen to
# do, on 2026-11-25 with free keys:
# docs/adr/0027-cloud-models-through-their-openai-compatible-layers.md.

default = "standard"
titles = "standard"

[providers.ollama]
kind = "ollama"

# The two cloud providers are given 30 seconds to begin an answer, not the 90 a local
# server keeps for a model it loads first: a cloud server that hasn't begun after half
# a minute has more likely hung than is still loading, and the model that stands in is
# asked sooner. On 2026-11-25, the Gemini API's flash-lite began its answer to a prompt
# of 113,754 tokens after 4.0 and 4.5 seconds, in two tries. For a whole answer they
# keep the client's 300 seconds (`answers_within_seconds`): nothing measured says that
# they need another time.

# Groq's OpenAI-compatible API. A key is made at https://console.groq.com/keys.
[providers.groq]
kind = "openai-compatible"
url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
begins_within_seconds = 30

# The Gemini API's OpenAI-compatible layer. A key is made at
# https://aistudio.google.com/apikey.
[providers.gemini]
kind = "openai-compatible"
url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
begins_within_seconds = 30

# The model Actio ships with, as config/models.toml offers it.
[models.standard]
title = "Qwen 3.5 4B"
provider = "ollama"
model = "qwen3.5:4b-q4_K_M"
context_window = 8192
max_output_tokens = 2048

# Each of these two models holds 131,072 tokens, as Groq's list of models says: its
# context_window. Groq's free plan takes, for each of them, 8,000 tokens a minute and
# 1,000 requests a day, as its answers' headers said on 2026-11-25, and 30 requests a
# minute and 200,000 tokens a day, as its documentation said that day: tokens_a_minute,
# requests_a_day, requests_a_minute and tokens_a_day. It refuses a request larger than
# its tokens a minute whole: a request larger than that, by Actio's guess, isn't sent to
# Groq while another model that may answer it has room for it. Actio counts what it
# sends to each model, and keeps to nine tenths of each figure: a model that has nothing
# left of one for a request is asked after those of its chain that have some, and when
# none of those with room has any, the question is refused for now, with how long to
# wait. A model whose provider refused a request and said to wait longer than 2 seconds
# counts as having nothing left too, until that wait is over. `make preflight` holds
# requests_a_day and tokens_a_minute to the headers' figures for your account, and
# context_window and max_output_tokens to Groq's list of models, and fails where this
# file states more. requests_a_minute and tokens_a_day, which no answer states, it can't
# check: read them at https://console.groq.com/settings/limits. Raise them on a paid
# plan.
#
# These models always reason, and "low" is the least they can be told: a turn that asks
# for no reasoning gets that, and one that asks for reasoning gets "medium". Told "high",
# the larger one spent all 2,048 tokens of an answer on its thoughts, counting the words
# of the answer it meant to give, and the answer was cut short; told "medium", the same
# question took about 250 tokens, twice.
#
# Leave `titles` with a model that can go without reasoning. A title gets room for 24
# tokens, and these models' thoughts took all of it: none of five titles came.
[models.groq-large]
title = "GPT-OSS 120B (Groq)"
provider = "groq"
model = "openai/gpt-oss-120b"
context_window = 131072
tokens_a_minute = 8000
tokens_a_day = 200000
requests_a_minute = 30
requests_a_day = 1000
max_output_tokens = 2048
thinking = true
thinking_off = { reasoning_effort = "low" }
thinking_on = { reasoning_effort = "medium" }
# Groq's free plan limits the requests of a minute, and its tokens: then Gemini 3.5
# Flash-Lite answers in this model's place, and the local model when flash-lite is too
# busy. A request larger than a model's room, its window or its tokens a minute,
# whichever is less, isn't sent to it while another of the three is ready and has room
# for it: one of 11,000 tokens, by Actio's guess, goes to flash-lite alone, with its
# 250,000 a minute, and not to Groq, nor to the local model, with its window of 8,192.
# So a question to this model may go to any of the three servers.
then = ["gemini-lite", "standard"]

[models.groq-small]
title = "GPT-OSS 20B (Groq)"
provider = "groq"
model = "openai/gpt-oss-20b"
context_window = 131072
tokens_a_minute = 8000
tokens_a_day = 200000
requests_a_minute = 30
requests_a_day = 1000
max_output_tokens = 2048
thinking = true
thinking_off = { reasoning_effort = "low" }
thinking_on = { reasoning_effort = "medium" }

# The Gemini API's two models. As one free account had them on 2026-11-25:
# gemini-3.6-flash 5 requests a minute, 250,000 tokens a minute and 20 requests a day;
# gemini-3.5-flash-lite 15 requests a minute, 250,000 tokens a minute and 500 requests
# a day. So flash-lite is the one for more than a few questions a day. Yours are at
# https://aistudio.google.com/rate-limit: no answer's headers state them. They are each
# model's requests_a_minute, tokens_a_minute and requests_a_day below. As for Groq's,
# Actio keeps to nine tenths of each figure, and a model that has nothing left of one
# for a request is asked after those of its chain that have some.
#
# context_window is the model's own window, 1,048,576 tokens, and tokens_a_minute the
# 250,000 that the free tier allowed each model that day, which the Gemini API's
# documentation counts as input tokens. A request larger than that, by Actio's guess,
# isn't sent there while another model that may answer it has room for it. Groq was
# seen to refuse such a request whole; with the Gemini API it wasn't tried. Raise it on
# a paid plan, to what the page above says. `make preflight` holds context_window and
# max_output_tokens to what the API states of each model, and fails where this file
# states more. None of the three limits can it check, since the API states none: read
# them on the page above.

# The API sends this model's thoughts only when it is asked to, which `thinking_on`
# does. A turn that asks for no reasoning is told Actio's own "none", which it takes.
[models.gemini-flash]
title = "Gemini 3.6 Flash"
provider = "gemini"
model = "gemini-3.6-flash"
context_window = 1048576
tokens_a_minute = 250000
requests_a_minute = 5
requests_a_day = 20
max_output_tokens = 8192
thinking = true
thinking_on = { extra_body = { google = { thinking_config = { include_thoughts = true } } } }

# This model refuses "none", so a turn that asks for no reasoning is told nothing,
# `thinking_off = {}`, and then it doesn't reason. It reasons only when it is told to:
# asked to show its thoughts and nothing more, it showed none. On 2026-11-25, 11 of its
# 17 answers with reasoning were refused or broke off because the model was too busy,
# at each level of thinking that was tried, and none of 12 without: the page then says
# so, and offers another try.
[models.gemini-lite]
title = "Gemini 3.5 Flash-Lite"
provider = "gemini"
model = "gemini-3.5-flash-lite"
context_window = 1048576
tokens_a_minute = 250000
requests_a_minute = 15
requests_a_day = 500
max_output_tokens = 8192
thinking = true
thinking_off = {}
thinking_on = { extra_body = { google = { thinking_config = { include_thoughts = true, thinking_level = "high" } } } }
